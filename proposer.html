<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Proposer une pépite — Free Pépites</title><style>:root{--bg:#f7f7f8;--line:#e5e7eb;--red:#d50000;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#171717}.wrap{max-width:720px;margin:auto;padding:30px 18px 70px}.brand{font-weight:900;font-size:20px;margin-bottom:28px}.brand b{color:var(--red)}.hero{background:#171717;color:white;border-radius:25px;padding:30px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(30px,6vw,48px)}.hero p{margin:0;color:#d1d5db;line-height:1.5}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:24px}label{display:block;font-weight:800;margin:18px 0 7px}.hint{font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}input,textarea{width:100%;border:1px solid #d1d5db;border-radius:13px;padding:13px 14px;font:inherit}textarea{min-height:190px;resize:vertical;line-height:1.5}.btn{width:100%;margin-top:20px;border:0;border-radius:14px;padding:14px;background:#171717;color:white;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.status{display:none;margin-top:16px;padding:13px;border-radius:12px;font-size:14px}.status.show{display:block}.ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}</style></head><body><div class="wrap"><div class="brand"><b>FREE</b> — Les Pépites</div><section class="hero"><h1>Proposer une pépite</h1><p>Vous avez reçu un message mémorable ? Envoyez-le ici. La proposition sera relue avant d'apparaître sur le site.</p></section><section class="card"><label for="title">Titre<div class="hint">Un titre court qui résume la pépite.</div></label><input id="title" maxlength="100" placeholder="Ex. Le Wi-Fi sans fil"><label for="text">Message<div class="hint">Retirez tout nom, numéro, adresse, e-mail ou autre information permettant d'identifier l'abonné.</div></label><textarea id="text" maxlength="4000" placeholder="Collez le message ici…"></textarea><label for="author">Votre prénom ou pseudo <span style="font-weight:400;color:#6b7280">(facultatif)</span></label><input id="author" maxlength="50" placeholder="Ex. Allan"><button class="btn" id="send">Envoyer la proposition</button><div class="status" id="status"></div><div class="note">La proposition n'est pas publiée automatiquement : elle doit d'abord être validée par l'administrateur.</div></section></div><script>
const SUPABASE_URL='https://ysnfxplpqkkgmmgwsnxl.supabase.co';
const SUPABASE_KEY='sb_publishable_jNIGVtqtp8CW5Uy-Xq0qiQ_AbdfHvej';
const el=id=>document.getElementById(id);function msg(t,ok){el('status').className='status show '+(ok?'ok':'err');el('status').textContent=t}
el('send').onclick=async()=>{let titre=el('title').value.trim(),texte=el('text').value.trim(),auteur=el('author').value.trim();if(!titre||!texte){msg('Renseignez un titre et un message.',false);return}el('send').disabled=true;el('send').textContent='Envoi…';try{let r=await fetch(SUPABASE_URL+'/rest/v1/propositions',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({titre,texte,auteur:auteur||null})});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.message||d.error||('Erreur '+r.status))}el('title').value='';el('text').value='';el('author').value='';msg('Merci ! La pépite a bien été envoyée pour validation.',true)}catch(e){msg('Envoi impossible : '+e.message,false)}finally{el('send').disabled=false;el('send').textContent='Envoyer la proposition'}};
</script></body></html>
